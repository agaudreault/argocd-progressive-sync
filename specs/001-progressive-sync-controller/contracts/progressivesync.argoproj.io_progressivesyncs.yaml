# CRD contract (design artifact) for the ProgressiveSync resource.
# This describes the intended API surface (spec + status) for the first design phase.
# The authoritative CRD will be generated by controller-gen from api/v1alpha1 Go types;
# this file is the reviewed contract that generation must satisfy.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: progressivesyncs.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ProgressiveSync
    listKind: ProgressiveSyncList
    plural: progressivesyncs
    singular: progressivesync
    shortNames:
      - ps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Step
          type: integer
          jsonPath: .status.currentStepIndex
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [selector, strategy]
              properties:
                selector:
                  description: >-
                    Selects the Argo CD Applications governed by this ProgressiveSync
                    (app labels, namespace scope, and optional installation-id scoping).
                  type: object
                  properties:
                    application:
                      description: >-
                        Native Kubernetes label selector over Application labels.
                        Empty = all apps in scope.
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key: { type: string }
                              operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
                              values:
                                type: array
                                items: { type: string }
                    namespace:
                      description: >-
                        Native Kubernetes label selector over Namespace objects, choosing which
                        namespaces to search for Applications. Omitted = only the ProgressiveSync's
                        own namespace.
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key: { type: string }
                              operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
                              values:
                                type: array
                                items: { type: string }
                    installationID:
                      description: >-
                        Optionally scopes selection to a specific Argo CD installation id
                        (argocd.argoproj.io/installation-id). When empty, the controller's
                        configured bound installation id applies.
                      type: string
                strategy:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [RollingSync]
                    rollingSync:
                      type: object
                      required: [steps]
                      properties:
                        steps:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              matchExpressions:
                                type: array
                                items:
                                  type: object
                                  required: [key, operator]
                                  properties:
                                    key: { type: string }
                                    operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
                                    values:
                                      type: array
                                      items: { type: string }
                              maxUpdate:
                                x-kubernetes-int-or-string: true
                                anyOf:
                                  - type: integer
                                  - type: string
            status:
              type: object
              properties:
                observedGeneration: { type: integer, format: int64 }
                phase:
                  type: string
                  enum: [Pending, Progressing, Healthy, Error]
                message: { type: string }
                currentStepIndex: { type: integer }
                currentStepName: { type: string }
                startedAt: { type: string, format: date-time }
                finishedAt: { type: string, format: date-time }
                applicationStatuses:
                  type: array
                  items:
                    type: object
                    required: [name, namespace]
                    properties:
                      name: { type: string }
                      namespace: { type: string }
                      step: { type: integer }
                      syncStatus: { type: string }
                      healthStatus: { type: string }
                      status:
                        type: string
                        enum: [Pending, Progressing, Completed, Excluded, Error]
                      message: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason: { type: string }
                      message: { type: string }
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      startedAt: { type: string, format: date-time }
                      finishedAt: { type: string, format: date-time }
                      result: { type: string, enum: [Completed, Superseded] }
                      message: { type: string }
                      revisionHash: { type: string }
